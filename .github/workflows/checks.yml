name: Check Relaypad
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check wire compatibility and pairing-code editing
        run: |
          checks/protocol-v1.sh
          xcrun swiftc Shared/RemoteProtocol.swift Phone/PairingCodeEdit.swift checks/PairingCodeEditingTests.swift -o "$RUNNER_TEMP/pairing-edits"
          "$RUNNER_TEMP/pairing-edits"
      - name: Check the Mac input driver
        run: |
          xcrun swiftc Shared/RemoteProtocol.swift Mac/InputInjector.swift checks/MacInputTests.swift -o "$RUNNER_TEMP/mac-input-tests"
          "$RUNNER_TEMP/mac-input-tests"
      - name: Build the receiver
        run: |
          xcodebuild -project Relaypad.xcodeproj -scheme 'Relaypad for Mac' -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build and test the iPhone app
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcodebuild -project Relaypad.xcodeproj -scheme Relaypad -configuration Debug -destination "id=$device" -parallel-testing-enabled NO test
          xcrun simctl bootstatus "$device" -b
          python3 checks/pairing-code-uikit.py "$device"
